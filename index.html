<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="eduardfolch.bike · Passió per la mobilitat amb bicicleta">
<meta name="theme-color" content="#0c0b0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e3122b%22/%3E%3Cg fill=%22none%22 stroke=%22%23efe8e4%22 stroke-width=%227%22%3E%3Ccircle cx=%2228%22 cy=%2262%22 r=%2216%22/%3E%3Ccircle cx=%2272%22 cy=%2262%22 r=%2216%22/%3E%3Cpath d=%22M28 62 L48 62 L40 36 Z M40 36 L64 34 L48 62 M64 34 L72 62%22/%3E%3C/g%3E%3C/svg%3E">
<title>eduardfolch.bike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: barra superior amb marca, idiomes i "Play game"; mosaic de blocs amb bicis i banda vermella; contacte; el joc s'obre a pantalla completa */
:root{
  --black:#0c0b0b;
  --coal:#1b1718;
  --oxblood:#4a0b12;
  --red:#e3122b;
  --flame:#ff3b1f;
  --bone:#efe8e4;
  --mute:#9d8e8f;
  --font:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--black);color:var(--bone);font-family:var(--font);font-size:16px;overflow-x:hidden}
button{font-family:var(--font)}
button:focus-visible,a:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

/* ---------- Barra superior ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--black)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(12,11,11,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(239,232,228,.08)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:10px}
.brand{font-weight:500;font-size:22px;letter-spacing:-.05em;color:var(--bone);text-decoration:none;white-space:nowrap}
.brand sup{font-size:.45em;letter-spacing:0;margin-left:1px}
.bar-r{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(239,232,228,.07)}
.lang button{font:700 12px/1 var(--font);letter-spacing:.08em;color:var(--bone);background:transparent;border:0;border-radius:999px;padding:8px 10px;cursor:pointer;opacity:.6;transition:opacity .2s, background .2s}
.lang button:hover{opacity:1}
.lang button[aria-pressed="true"]{background:var(--bone);color:var(--black);opacity:1}
.pg{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--red);color:var(--bone);
  font-weight:800;font-size:14px;letter-spacing:.02em;text-transform:uppercase;padding:10px 16px 10px 12px;border-radius:999px;
  box-shadow:0 0 0 0 rgba(227,18,43,.6);animation:ping 2.4s ease-out infinite;transition:background .2s}
.pg:hover{background:var(--flame)}
.pg .disc{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bone);color:var(--red)}
.pg .disc::before{content:"";border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(227,18,43,.55)}70%,100%{box-shadow:0 0 0 14px rgba(227,18,43,0)}}

/* ---------- Mosaic ---------- */
.top{position:relative;display:grid;grid-template-columns:1.1fr 3fr 1.6fr .35fr;height:clamp(360px, 64vh, 660px)}
.tile{position:relative;overflow:hidden;display:grid;place-items:center;container-type:inline-size;animation:reveal .9s cubic-bezier(.7,0,.2,1) both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.t-bone{background:linear-gradient(180deg,#d9d2cf,var(--bone));color:var(--black)}
.t-black{background:linear-gradient(180deg,#000,var(--coal));color:var(--bone)}
.t-ox{background:linear-gradient(180deg,#350810,var(--oxblood));color:var(--red)}
.t-flame{background:var(--flame)}
.tile .bike{width:min(80%,440px);transform:translateY(-12%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.t-black .bike{width:min(64%,540px)}
.t-black .accent{stroke:var(--red)}
.tile:hover .bike{transform:translateY(-12%) translateX(6%)}
.tile:hover .wheel{animation-duration:.5s}

.bike{display:block;overflow:visible;animation:bob 3.2s ease-in-out infinite}
.bike *{vector-effect:non-scaling-stroke}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.crank{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{translate:0 -4px}}

.band{position:absolute;left:0;right:0;top:64%;z-index:5;background:var(--red);color:var(--black);overflow:hidden;animation:bandIn 1s cubic-bezier(.7,0,.2,1) .35s both}
@keyframes bandIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.track{display:flex;width:max-content;animation:marquee 32s linear infinite}
.group{display:flex;align-items:center;gap:clamp(28px,4vw,64px);padding:18px clamp(28px,4vw,64px) 18px 0}
.mark{font-weight:500;font-size:clamp(34px,4.6vw,58px);letter-spacing:-.055em;line-height:1;white-space:nowrap}
.mark sup{font-size:.32em;letter-spacing:0;vertical-align:top;position:relative;top:.1em;margin-left:.08em}
.meta{font-size:15px;line-height:1.3;white-space:nowrap}
.meta b{font-weight:700;display:block}
.num{font-variant-numeric:tabular-nums}
@keyframes marquee{to{transform:translateX(-50%)}}
.band:hover .track{animation-play-state:paused}

/* ---------- Contacte ---------- */
.bottom{display:grid;grid-template-columns:1fr 1fr;min-height:clamp(360px,48vh,520px)}
.contact{background:linear-gradient(180deg,#141112,var(--black));display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:clamp(24px,4vw,56px);padding-block:clamp(32px,5vw,56px)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0}
.contact h2{font-weight:800;font-size:clamp(48px,7.4vw,112px);line-height:.88;letter-spacing:-.055em;margin:14px 0 0;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.btn{display:inline-flex;align-items:center;gap:14px;text-decoration:none;font-weight:700;font-size:20px;letter-spacing:-.01em;
  color:var(--black);background:var(--bone);padding:16px 22px 16px 26px;border-radius:999px;transition:background .25s, color .25s}
.btn .arrow{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--bone);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover{background:var(--red);color:var(--bone)}
.btn:hover .arrow{background:var(--black);transform:rotate(-45deg)}
.mail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.mail span{user-select:all;overflow-wrap:anywhere;font-size:15px;opacity:.8}
.copy{font:700 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--bone);background:transparent;border:1px solid rgba(239,232,228,.25);border-radius:999px;padding:7px 11px;cursor:pointer}
.copy:hover{border-color:var(--red);color:var(--red)}
.road{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--red),#c20e22);color:var(--black);container-type:inline-size;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding-right:max(24px, env(safe-area-inset-right,0px));padding-left:clamp(24px,4vw,56px);padding-block:clamp(32px,5vw,56px)}
.rider{position:absolute;left:0;width:var(--w);animation:ride var(--d) linear infinite;animation-delay:var(--delay);color:var(--c)}
.rider .bike{animation-duration:1.4s}.rider .wheel{animation-duration:.7s}
@keyframes ride{from{transform:translateX(calc(-1 * var(--w) - 20px))}to{transform:translateX(calc(100cqw + 20px))}}
.lane{position:absolute;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,rgba(12,11,11,.35) 0 28px,transparent 28px 56px);animation:dash 1.2s linear infinite}
@keyframes dash{to{background-position:56px 0}}
.wordmark{position:relative;z-index:2;font-weight:500;letter-spacing:-.06em;line-height:.85;margin:0;font-size:clamp(44px,8.6cqw,128px);white-space:nowrap}
.wordmark sup{font-size:.25em;letter-spacing:0;vertical-align:top;position:relative;top:.15em}
.foot{position:relative;z-index:2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:500;margin-top:18px}

/* ================= JOC (pantalla completa) ================= */
.gm{position:fixed;inset:0;z-index:100;background:#0e0b0c;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.x{position:absolute;z-index:8;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(12,11,11,.75);color:var(--bone);font-size:20px;font-weight:700;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.x:hover{background:var(--red)}

.screen{position:absolute;inset:0;z-index:6;display:flex;overflow-y:auto;background:rgba(12,11,11,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
.inner{margin:auto;width:100%;max-width:1040px;display:flex;flex-direction:column;gap:22px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
.step{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0}
.screen h2{margin:6px 0 0;font-weight:900;font-size:clamp(40px,6.4vw,84px);line-height:.88;letter-spacing:-.06em}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;
  background:linear-gradient(180deg,#1e191a,#151112);border:2px solid rgba(239,232,228,.08);border-radius:22px;padding:18px;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s, background .2s}
.card:hover{transform:translateY(-4px);border-color:rgba(239,232,228,.25)}
.card:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.card[aria-pressed="true"]{border-color:var(--red);background:linear-gradient(180deg,#3a0a11,#1a0c0e)}
.card[aria-pressed="true"]::after{content:"✓";position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--red);
  display:grid;place-items:center;font-weight:900;font-size:14px}
.card .art{height:120px;display:grid;place-items:center;color:var(--bone)}
.card .art .bike{width:100%;max-width:240px;animation:none}
.card .art .wheel{animation-play-state:paused}
.card:hover .art .wheel,.card[aria-pressed="true"] .art .wheel{animation-play-state:running}
.card .art .accent{stroke:var(--red)}
.card .art .box{fill:var(--red)}
.card h3{margin:0;font-weight:800;font-size:26px;letter-spacing:-.04em;line-height:1}
.card p{margin:0;color:#c9bcbd;font-size:14px;line-height:1.45}
.stats{display:grid;gap:7px;margin-top:auto}
.stat{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.seg i{height:7px;border-radius:2px;background:rgba(239,232,228,.12)}
.seg i.on{background:var(--bone)}
.card[aria-pressed="true"] .seg i.on{background:var(--red)}
.goal{margin-top:auto;display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 11px;border-radius:999px;background:rgba(239,232,228,.08)}
.best{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.icon{width:76px;height:76px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.go{display:inline-flex;align-items:center;gap:12px;border:0;cursor:pointer;font-weight:800;font-size:18px;color:var(--bone);background:var(--red);
  padding:15px 26px;border-radius:999px;box-shadow:0 14px 40px -14px var(--red);transition:background .2s, transform .2s}
.go:hover{background:var(--flame);transform:translateY(-2px)}
.ghost{border:1px solid rgba(239,232,228,.25);cursor:pointer;font-weight:700;font-size:16px;color:var(--bone);background:transparent;padding:14px 22px;border-radius:999px}
.ghost:hover{border-color:var(--bone)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:#c9bcbd}
.keys span{display:inline-flex;align-items:center;gap:6px}
kbd{font:700 12px/1 var(--font);background:var(--bone);color:var(--black);border-radius:6px;padding:5px 7px;box-shadow:0 2px 0 #9e9390}

.center{max-width:560px;align-items:center;text-align:center}
.stars{display:flex;gap:10px;justify-content:center}
.stars svg{width:56px;height:56px}
.stars .s{fill:rgba(239,232,228,.12);transition:fill .3s}
.stars .s.on{fill:var(--red)}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:#c9bcbd;text-align:left}
.slist li{display:flex;gap:10px;align-items:center}
.slist li::before{content:"★";color:rgba(239,232,228,.2)}
.slist li.on::before{color:var(--red)}
.big{font-size:44px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.sub{color:#c9bcbd;margin:0}

.ghud{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px, env(safe-area-inset-left,0px));right:calc(66px + env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(12,11,11,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip b{font-size:15px;letter-spacing:0;font-variant-numeric:tabular-nums}
.prog{min-width:180px}
.prog .barw{flex:1;height:6px;border-radius:3px;background:rgba(239,232,228,.15);overflow:hidden;min-width:60px}
.prog .barw i{display:block;height:100%;width:0;background:var(--red);border-radius:3px;transition:width .2s}
.life{width:12px;height:12px;border-radius:50%;border:2px solid var(--red);box-sizing:border-box}
.life.on{background:var(--red)}
.chip button{all:unset;cursor:pointer;font-weight:800;letter-spacing:.08em}
.warn b{color:var(--flame)}

.touch{position:absolute;z-index:5;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.touch .grp{display:flex;gap:10px}
.touch button{width:60px;height:60px;border-radius:50%;border:0;background:rgba(12,11,11,.72);color:var(--bone);font-size:22px;font-weight:800;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:none}
.touch button:active{background:var(--red)}
.touch .bell{background:var(--red)}
@media (pointer:coarse), (max-width:860px){ .gm.playing .touch{display:flex} }

@media (max-width:860px){
  .top{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;height:auto}
  .tile{aspect-ratio:1/1;max-width:100%}
  .tile:nth-child(2){grid-column:1 / -1;aspect-ratio:16/10;order:-1}
  .tile:nth-child(4){display:none}
  .band{top:auto;bottom:calc(50% - 40px)}
  .bottom{grid-template-columns:1fr}
  .road{min-height:300px}
  .cards{grid-template-columns:1fr}
  .card .art{height:96px}
  .keys{display:none}
  .prog{min-width:0}
}
@media (max-width:420px){ .brand{font-size:18px} .pg{font-size:12px;padding:9px 12px 9px 9px} }
@media (prefers-reduced-motion:reduce){
  .tile,.band,.track,.bike,.wheel,.crank,.rider,.lane,.inner,.pg{animation:none!important}
}
</style>

<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<!-- ================= BARRA SUPERIOR ================= -->
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#">eduardfolch.bike<sup>®</sup></a>
    <div class="bar-r">
      <nav class="lang" aria-label="Idioma">
        <button type="button" data-lang="ca">CA</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </nav>
      <button class="pg" id="openGame" type="button"><span class="disc" aria-hidden="true"></span>Play game</button>
    </div>
  </div>
</header>

<!-- ================= MOSAIC ================= -->
<section class="top">
  <div class="tile t-bone" data-bike="city"></div>
  <div class="tile t-black" data-bike="cargo"></div>
  <div class="tile t-ox" data-bike="fold"></div>
  <div class="tile t-flame" aria-hidden="true"></div>
  <div class="band" aria-hidden="true"><div class="track" id="track"></div></div>
</section>

<!-- ================= CONTACTE ================= -->
<section class="bottom">
  <div class="contact">
    <div>
      <p class="eyebrow" data-i18n="eyebrow">Contacte</p>
      <h2 data-i18n="title">Parlem de bicis.</h2>
    </div>
    <div class="actions">
      <a class="btn" href="mailto:eduard.folch@gmail.com?subject=eduardfolch.bike">
        <span data-i18n="cta">Escriu-me</span>
        <span class="arrow" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <div class="mail">
        <span id="addr">eduard.folch@gmail.com</span>
        <button class="copy" id="copy" type="button" data-i18n="copy">Copiar</button>
      </div>
    </div>
  </div>
  <div class="road">
    <div class="lane" style="top:30%"></div>
    <div class="lane" style="top:58%"></div>
    <div id="riders"></div>
    <p class="wordmark">eduardfolch.bike<sup>®</sup></p>
    <div class="foot"><span>© 2026</span><span class="num">41.3874° N, 2.1686° E · Barcelona</span></div>
  </div>
</section>

<!-- ================= JOC ================= -->
<div class="gm" id="gm" hidden role="dialog" aria-modal="true" aria-label="Carril Bici">
  <canvas id="game" aria-hidden="true"></canvas>
  <button class="x" id="closeGame" type="button" aria-label="Tancar">✕</button>

  <div class="ghud" id="ghud" hidden>
    <div class="chip prog"><span id="hLabel">Paquets</span><b id="hProg">0/8</b><span class="barw"><i id="hBar"></i></span></div>
    <div class="chip" id="hTimeChip"><span>⏱</span><b id="hTime">1:15</b></div>
    <div class="chip" id="hLives"></div>
    <div class="chip"><span data-i18n="score">Punts</span><b id="hScore">0</b></div>
    <div class="chip"><button type="button" id="pauseBtn" data-i18n="pause">Pausa</button></div>
  </div>

  <!-- Pas 1: bici -->
  <section class="screen" id="scrBike">
    <div class="inner">
      <div><p class="step" data-i18n="step1">Pas 1 de 2</p><h2 data-i18n="chooseBike">Escull la bici</h2></div>
      <div class="cards" id="bikeCards"></div>
      <div class="row">
        <div class="keys">
          <span><kbd>←</kbd><kbd>→</kbd> <i data-i18n="kLane">carril</i></span>
          <span><kbd>↑</kbd> <i data-i18n="kFast">accelerar</i></span>
          <span><kbd>↓</kbd> <i data-i18n="kBrake">frenar</i></span>
          <span><kbd data-i18n="space">Espai</kbd> <i data-i18n="kBell">timbre</i></span>

/* ======================= BICIS SVG (vista lateral) ======================= */
const spokes = (cx, cy, r) => { let d=''; for (let i=0;i<8;i++){const a=i*Math.PI/4; d+=`M${cx} ${cy} L${(cx+Math.cos(a)*r).toFixed(1)} ${(cy+Math.sin(a)*r).toFixed(1)} `;} return `<path stroke-width="1.1" d="${d}"/>`; };
const wheel = (cx, cy, r) => `<g class="wheel"><circle cx="${cx}" cy="${cy}" r="${r}"/>${spokes(cx,cy,r)}<circle cx="${cx}" cy="${cy}" r="2.5" fill="currentColor"/></g>`;
const SVG_BIKE = {
  city: () => `<svg class="bike" viewBox="0 0 260 130" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  fold: () => `<svg class="bike" viewBox="0 0 260 130" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

document.querySelectorAll('[data-bike]').forEach(t => t.innerHTML = SVG_BIKE[t.dataset.bike]());
document.getElementById('riders').innerHTML = [
  {top:'6%',w:'150px',d:'9s',delay:'0s',c:'var(--black)',b:'city'},
  {top:'34%',w:'110px',d:'7s',delay:'-3s',c:'var(--bone)',b:'fold'},

const ICON = {
  deliver:`<svg class="icon" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M14 28 L40 16 L66 28 L66 58 L40 70 L14 58 Z M14 28 L40 40 L66 28 M40 40 V70"/><path d="M27 22 L53 34 V46" stroke="#e3122b" stroke-width="5"/></svg>`,

};

/* ======================= CONFIG JOC ======================= */
const BIKES = {
  fold:{top:1.0, agil:16, brake:1.2, lives:3, carry:1, stats:[3,5,5,1]},
  city:{top:1.12, agil:11, brake:1.0, lives:3, carry:1, stats:[5,3,3,2]},
  cargo:{top:.88, agil:7, brake:.75, lives:4, carry:2, stats:[2,2,2,5]}
};
const MISSIONS = {
  deliver:{timed:75, goal:8, lightGap:2300, gap:190, table:{parcel:30,cone:18,ped:14,hole:10,scoot:10,coin:6,turbo:5,puddle:5,heart:2}},
  rush:{goal:1500, lightGap:1150, gap:150, table:{cone:15,ped:22,dog:10,scoot:20,hole:10,coin:10,turbo:5,puddle:6,heart:2}},
  night:{timed:60, goal:10, lightGap:2000, gap:175, night:true, table:{coin:32,cone:18,ped:12,dog:8,hole:14,scoot:6,turbo:4,puddle:4,heart:2}}
};
let pick = {bike:'city', mission:'deliver'};
let bests = {};
try { pick = Object.assign(pick, JSON.parse(localStorage.getItem('efb-pick')||'{}')); bests = JSON.parse(localStorage.getItem('efb-bests')||'{}'); } catch(e){}
if(!BIKES[pick.bike]) pick.bike='city'; if(!MISSIONS[pick.mission]) pick.mission='deliver';
const save = () => { try { localStorage.setItem('efb-pick', JSON.stringify(pick)); localStorage.setItem('efb-bests', JSON.stringify(bests)); } catch(e){} };

/* ======================= DOM ======================= */
const $ = id => document.getElementById(id);
const gm=$('gm'), cv=$('game'), ctx=cv.getContext('2d');
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
const screens = ['scrBike','scrMission','scrPause','scrEnd'];
function show(id){ screens.forEach(s => $(s).hidden = s!==id); $('ghud').hidden = !!id && id!=='scrPause'; }

function renderCards(){
  $('bikeCards').innerHTML = Object.keys(BIKES).map(k => {
    const st = BIKES[k].stats, lbl = ['sSpeed','sAgil','sBrake','sLoad'];
    return `<button class="card" type="button" data-bike="${k}" aria-pressed="${pick.bike===k}">
      <div class="art">${SVG_BIKE[k]()}</div><h3>${tr('b_'+k)}</h3><p>${tr('d_'+k)}</p>
      <div class="stats">${st.map((v,i)=>`<div class="stat"><span>${tr(lbl[i])}</span><span class="seg">${[0,1,2,3,4].map(j=>`<i class="${j<v?'on':''}"></i>`).join('')}</span></div>`).join('')}</div>
    </button>`;
  }).join('');
  $('missionCards').innerHTML = Object.keys(MISSIONS).map(k => {
    const b = bests[k];
    return `<button class="card" type="button" data-mission="${k}" aria-pressed="${pick.mission===k}">
      <div class="art">${ICON[k]}</div><h3>${tr('m_'+k)}</h3><p>${tr('md_'+k)}</p>
      <span class="goal">${tr('g_'+k)}</span>
      <span class="best">${b ? `${tr('best')}: ${b.score} · ${'★'.repeat(b.stars)}${'☆'.repeat(3-b.stars)}` : '&nbsp;'}</span>
    </button>`;
  }).join('');
  $('bikeCards').querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { pick.bike=c.dataset.bike; save(); renderCards(); $('bikeCards').querySelector(`[data-bike="${pick.bike}"]`).focus(); }));
  $('missionCards').querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { pick.mission=c.dataset.mission; save(); renderCards(); $('missionCards').querySelector(`[data-mission="${pick.mission}"]`).focus(); }));
}

/* ======================= SO ======================= */
let ac=null;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
function tone(f,d,type='sine',vol=.2,delay=0,slide){
  if(!ac) return; const n=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,n); if(slide) o.frequency.exponentialRampToValueAtTime(slide,n+d);
  g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(vol,n+.01); g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n+d+.05);
}
const S = {
  bell(){ tone(2093,.7,'sine',.22); tone(2637,.7,'sine',.16,.11); tone(4186,.25,'sine',.05,.11); },
  crash(){ tone(180,.35,'square',.12,0,50); },
  coin(){ tone(988,.08,'square',.06); tone(1319,.16,'square',.06,.07); },
  parcel(){ tone(523,.1,'triangle',.15); tone(784,.1,'triangle',.15,.08); tone(1047,.2,'triangle',.15,.16); },
  bad(){ tone(440,.18,'sawtooth',.08); tone(330,.3,'sawtooth',.08,.18); },
  turbo(){ tone(300,.5,'sawtooth',.07,0,1200); },
  beep(h){ tone(h?1320:660,.15,'square',.08); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.12)); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.16)); }
};

/* ======================= ESTAT ======================= */
const C = {bg:'#141112', side:'#2a2425', sideLine:'#352d2e', lane:'#7a0814', bone:'#efe8e4', red:'#e3122b', flame:'#ff3b1f', black:'#0c0b0b', tree:'#221c1d', tree2:'#2f2627', block:'#1d1819'};
let W=0, H=0, road={x:0,w:0,lw:0}, running=false;
let state='menu';  // menu | count | play | pause | end
let G = null;
const P = {lane:1, x:0, y:0, v:0, inv:0, turbo:0};
let keys = {};

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight; if(!W) return;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  fog.width=W*dpr; fog.height=H*dpr; fctx.setTransform(dpr,0,0,dpr,0,0);
  const lw = Math.max(74, Math.min(120, (W-60)/3.4));
  road = {lw, w:lw*3, x:(W-lw*3)/2};
  P.y = H*.74; P.x = laneX(P.lane);
}
const laneX = i => road.x + road.lw*(i+.5);
const rand = (a,b) => a + Math.random()*(b-a);

function newGame(){
  const b = BIKES[pick.bike], m = MISSIONS[pick.mission];
  G = {b, m, key:pick.mission, t:0, left:m.timed||0, scroll:0, dist:0, score:0, lives:b.lives, got:0, reds:0,
       objs:[], pops:[], parts:[], spawnAcc:0, lightAcc:600, bellT:-9, shake:0, count:3.2, finish:false, lastBeep:4};
  P.lane=1; P.x=laneX(1); P.v=0; P.inv=0; P.turbo=0; keys={};
}
function attract(){ G = {b:BIKES[pick.bike], m:MISSIONS[pick.mission], t:0, scroll:0, objs:[], pops:[], parts:[], shake:0, bellT:-9}; }

/* ======================= FLUX ======================= */
function openGame(){
  audio();
  gm.hidden=false; document.documentElement.style.overflow='hidden';
  resize(); state='menu'; attract(); renderCards(); show('scrBike');
  if(!running){ running=true; last=performance.now(); requestAnimationFrame(frame); }
  setTimeout(()=>$('bikeCards').querySelector('[aria-pressed="true"]')?.focus(), 50);
}
function closeGame(){
  gm.hidden=true; document.documentElement.style.overflow=''; running=false; state='menu'; gm.classList.remove('playing');
  $('openGame').focus();
}
function startGame(){ audio(); newGame(); state='count'; show(null); gm.classList.add('playing'); hud(true); }
function pause(){ if(state!=='play' && state!=='count') return; G.prev=state; state='pause'; gm.classList.remove('playing'); show('scrPause'); $('resume').focus(); }
function resume(){ if(state!=='pause') return; state=G.prev||'play'; show(null); gm.classList.add('playing'); }
function toMenu(){ state='menu'; gm.classList.remove('playing'); attract(); renderCards(); show('scrBike'); }
function end(win, reason){
  if(state==='end') return;
  state='end'; gm.classList.remove('playing');
  const stars = win ? 1 + (G.lives>=G.b.lives?1:0) + (G.reds===0?1:0) : 0;
  const score = Math.floor(G.score) + (win? 500 : 0);
  G.score = score;
  const prev = bests[G.key]; let nb=false;
  if(!prev || score>prev.score || stars>prev.stars){ bests[G.key] = {score:Math.max(score, prev?.score||0), stars:Math.max(stars, prev?.stars||0)}; nb = !prev || score>prev.score; save(); }
  win ? S.win() : S.lose();
  $('eMission').textContent = `${tr('m_'+G.key)} · ${tr('b_'+pick.bike)}`;
  $('eTitle').textContent = win ? tr('win') : tr('lose');
  $('eReason').textContent = win ? tr('rWin') : tr(reason);
  const star = on => `<svg viewBox="0 0 24 24"><path class="s ${on?'on':''}" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3l-5.9 3.2 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
  $('eStars').innerHTML = [0,1,2].map(i => star(i<stars)).join('');
  const conds = [win, win && G.lives>=G.b.lives, win && G.reds===0];
  $('eList').innerHTML = ['st1','st2','st3'].map((k,i)=>`<li class="${conds[i]?'on':''}">${tr(k)}</li>`).join('');
  $('eScore').textContent = score;
  $('eBest').textContent = nb ? tr('newBest') : `${tr('best')}: ${bests[G.key]?.score ?? score}`;
  show('scrEnd'); $('retry').focus();
}

/* ======================= HUD ======================= */
let hudCache='';
function hud(force){
  if(!G || !G.m) return;
  const m=G.m, isRush = pick.mission==='rush';
  const meters = Math.floor(G.dist/8);
  const prog = isRush ? Math.min(1, meters/m.goal) : Math.min(1, G.got/m.goal);
  const progTxt = isRush ? `${Math.min(meters,m.goal)}/${m.goal} m` : `${Math.min(G.got,m.goal)}/${m.goal}`;
  const time = m.timed ? Math.max(0, Math.ceil(G.left)) : 0;
  const key = [progTxt,time,G.lives,Math.floor(G.score),lang].join('|');
  if(key===hudCache && !force) return; hudCache=key;
  $('hLabel').textContent = isRush ? tr('dist') : pick.mission==='deliver' ? tr('parcels') : tr('plates');
  $('hProg').textContent = progTxt; $('hBar').style.width = (prog*100)+'%';
  $('hTimeChip').hidden = !m.timed;
  $('hTime').textContent = `${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}`;
  $('hTimeChip').classList.toggle('warn', m.timed && time<=10);
  $('hLives').innerHTML = Array.from({length:G.b.lives},(_,i)=>`<span class="life ${i<G.lives?'on':''}"></span>`).join('');
  $('hScore').textContent = Math.floor(G.score);
}
function pop(text,x,y,color=C.bone,size=18){ G.pops.push({text,x,y,t:0,color,size}); }
function burst(x,y,color,n=14){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=rand(60,220); G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.4,.8),t:0,color,r:rand(2,4)}); } }

/* ======================= ENTRADA ======================= */
function lane(d){ if(state!=='play') return; P.lane=Math.max(0,Math.min(2,P.lane+d)); }
function bell(){
  if(state!=='play' || G.t-G.bellT<.35) return;
  G.bellT=G.t; S.bell(); pop(tr('ring'), P.x, P.y-70, C.flame);
  for(const o of G.objs){
    if(o.y > P.y || o.y < P.y-360) continue;
    if(o.type==='ped' && !o.scared){ o.scared=true; o.vx=(o.x<road.x+road.w/2?-1:1)*250; }
    if(o.type==='scoot' && !o.moved){ o.moved=true; const opts=[o.lane-1,o.lane+1].filter(l=>l>=0&&l<3); o.lane=opts[Math.floor(Math.random()*opts.length)]; }
  }
}
addEventListener('keydown', e => {
  if(gm.hidden) return;
  const k=e.key;
  if(state==='play'||state==='count'){ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault(); }
  if(k==='Escape'){ if(state==='play'||state==='count') pause(); else if(state==='pause') resume(); else closeGame(); return; }
  if(k==='p'||k==='P'){ if(state==='play'||state==='count') pause(); else if(state==='pause') resume(); return; }
  if(state!=='play'){ keys[k]=true; return; }
  if(e.repeat && ['ArrowLeft','ArrowRight','a','d','A','D',' ','b','B'].includes(k)) return;
  if(k==='ArrowLeft'||k==='a'||k==='A') lane(-1);
  else if(k==='ArrowRight'||k==='d'||k==='D') lane(1);
  else if(k===' '||k==='b'||k==='B') bell();
  keys[k]=true;
});
addEventListener('keyup', e => { keys[e.key]=false; });
document.querySelectorAll('.touch button').forEach(b => {
  const a=b.dataset.t;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if(a==='left') lane(-1); else if(a==='right') lane(1); else if(a==='bell') bell(); else if(a==='brake') keys.tB=true; else if(a==='fast') keys.tF=true; });
  const up=()=>{ if(a==='brake') keys.tB=false; if(a==='fast') keys.tF=false; };
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up));
});
document.addEventListener('visibilitychange', () => { if(document.hidden && !gm.hidden) pause(); });
addEventListener('resize', () => { if(!gm.hidden) resize(); });

$('closeGame').addEventListener('click', closeGame);
$('toMission').addEventListener('click', () => { show('scrMission'); setTimeout(()=>$('missionCards').querySelector('[aria-pressed="true"]')?.focus(),30); });
$('backBike').addEventListener('click', () => show('scrBike'));
$('startGame').addEventListener('click', startGame);
$('pauseBtn').addEventListener('click', pause);

/* ======================= SPAWN ======================= */
const PED_COLORS=['#efe8e4','#c9b8b3','#ff3b1f','#8a7d7e','#e3122b','#5d4f50'];
function weighted(table){ let sum=0; for(const k in table) sum+=table[k]; let r=Math.random()*sum; for(const k in table){ r-=table[k]; if(r<=0) return k; } return 'cone'; }
function spawn(diff){
  const type = weighted(G.m.table), L = Math.floor(Math.random()*3), x = laneX(L), y=-40;
  switch(type){
    case 'cone':
      G.objs.push({type, x, y, r:12});
      if(Math.random() < .2+diff*.3){ const L2=(L+1+Math.floor(Math.random()*2))%3; G.objs.push({type, x:laneX(L2), y, r:12}); }
      break;
    case 'ped': { const left=Math.random()<.5; G.objs.push({type, x:left?road.x-26:road.x+road.w+26, y, vx:(left?1:-1)*rand(45,70+diff*30), r:11, c:PED_COLORS[Math.floor(Math.random()*PED_COLORS.length)], ph:Math.random()*6}); break; }
    case 'dog': { const left=Math.random()<.5; G.objs.push({type, x:left?road.x-20:road.x+road.w+20, y, vx:(left?1:-1)*rand(120,170), r:9, ph:0}); break; }
    case 'scoot': G.objs.push({type, lane:L, x, y:-60, vy:rand(90,150), r:11, c:PED_COLORS[Math.floor(Math.random()*PED_COLORS.length)]}); break;
    case 'hole': G.objs.push({type, x:x+rand(-12,12), y, r:15}); break;
    case 'puddle': G.objs.push({type, x, y, r:18}); break;
    case 'coin': for(let i=0;i<3;i++) G.objs.push({type, x, y:y-i*46, r:11}); break;
    case 'parcel': G.objs.push({type, x, y, r:13, ph:Math.random()*6}); break;
    case 'turbo': G.objs.push({type, x, y, r:13}); break;
    case 'heart': if(G.lives<G.b.lives) G.objs.push({type, x, y, r:12}); else G.objs.push({type:'coin', x, y, r:11}); break;
  }
}
const lightState = o => { const c=(G.t+o.ph)%7.5; return c<3.6?'green':c<4.6?'yellow':'red'; };

/* ======================= BUCLE ======================= */
let last=performance.now();
function frame(now){
  if(!running) return;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state==='play'||state==='count') update(dt);
  else if(state==='menu'){ G.t+=dt; G.scroll+=80*dt; }
  draw();
  requestAnimationFrame(frame);
}
function update(dt){
  const b=G.b, m=G.m;
  if(state==='count'){
    G.count-=dt; const n=Math.ceil(G.count-.2);
    if(n!==G.lastBeep && n>=0){ G.lastBeep=n; S.beep(n===0); }
    if(G.count<=0){ state='play'; }
    G.t+=dt; return;
  }
  G.t+=dt;
  if(m.timed){ G.left-=dt; if(G.left<=0){ G.left=0; hud(); return end(false,'rTime'); } }
  const prog = pick.mission==='rush' ? G.dist/(m.goal*8) : (m.timed - G.left)/m.timed;
  const diff = Math.min(1, prog);
  const cruise=(220+diff*110)*b.top, top=(420+diff*60)*b.top*(P.turbo>0?1.35:1);
  const fast=keys.ArrowUp||keys.w||keys.W||keys.tF, brk=keys.ArrowDown||keys.s||keys.S||keys.tB;
  if(P.turbo>0) P.v += (top-P.v)*Math.min(1,3*dt);
  else if(brk) P.v=Math.max(0,P.v-760*b.brake*dt);
  else if(fast) P.v=Math.min(top,P.v+320*dt);
  else P.v += (cruise-P.v)*Math.min(1,1.3*dt);
  P.x += (laneX(P.lane)-P.x)*Math.min(1,b.agil*dt);
  P.inv=Math.max(0,P.inv-dt); P.turbo=Math.max(0,P.turbo-dt); G.shake=Math.max(0,G.shake-dt);

  const dy=P.v*dt; G.scroll+=dy; G.dist+=dy; G.score+=dy*.05;
  G.spawnAcc+=dy; G.lightAcc+=dy;
  const nearFinish = pick.mission==='rush' && (m.goal*8 - G.dist) < H+200;
  if(G.spawnAcc > m.gap - diff*60){ G.spawnAcc=rand(-40,40); if(!nearFinish) spawn(diff); }
  if(G.lightAcc > m.lightGap){ G.lightAcc=rand(-200,200); if(!nearFinish) G.objs.push({type:'light', y:-90, ph:rand(0,7.5)}); }
  if(pick.mission==='rush' && !G.finish && (m.goal*8 - G.dist) < P.y+40){ G.finish=true; G.objs.push({type:'finish', y:P.y-(m.goal*8-G.dist)}); }

  // caixa de col·lisió segons la bici
  const hw = pick.bike==='cargo'?17:10, front = pick.bike==='cargo'?84:(pick.bike==='fold'?28:38), back = pick.bike==='cargo'?40:30;
  for(const o of G.objs){
    if(o.type==='scoot'){ o.y += dy - o.vy*dt; o.x += (laneX(o.lane)-o.x)*Math.min(1,4*dt); }
    else o.y += dy;
    if(o.type==='ped'||o.type==='dog'){ o.x+=o.vx*dt; o.ph+=dt*(o.type==='dog'?16:8); }
    if(o.type==='finish'){ if(o.y >= P.y-front){ o.done=true; return end(true); } continue; }
    if(o.type==='light'){
      const f=P.y-front, st=lightState(o);
      if(!o.passed && st==='red' && o.y<f && o.y>f-150 && P.v<12) o.waited=true;
      if(!o.passed && o.y>=f){
        o.passed=true;
        if(st==='red'){ G.reds++; hit(tr('red')); S.bad(); }
        else if(o.waited){ G.score+=150; pop(tr('civ'),P.x,P.y-80,'#7fd18b'); S.coin(); }
      }
      continue;
    }
    if(o.dead) continue;
    if(Math.abs(o.x-P.x) < o.r+hw && o.y > P.y-front-o.r && o.y < P.y+back+o.r){
      switch(o.type){
        case 'coin': o.dead=true; G.score+=50; if(pick.mission==='night') G.got++; S.coin(); burst(o.x,o.y,C.bone,8); pop('+50',o.x,o.y,C.bone,15); break;
        case 'parcel': { o.dead=true; const n=b.carry; if(pick.mission==='deliver') G.got+=n; G.score+=100*n; S.parcel(); burst(o.x,o.y,C.flame,14); pop(tr('parcel').replace('{n}',n),o.x,o.y-10,C.bone); break; }
        case 'turbo': o.dead=true; P.turbo=3; P.inv=Math.max(P.inv,3); S.turbo(); burst(o.x,o.y,C.red,20); pop(tr('turbo'),P.x,P.y-80,C.flame,22); break;
        case 'heart': o.dead=true; G.lives=Math.min(b.lives,G.lives+1); S.parcel(); pop(tr('life'),o.x,o.y,C.red); break;
        case 'hole': o.dead=true; if(P.turbo>0) break; P.v*=.45; G.score=Math.max(0,G.score-20); G.shake=.15; tone(120,.15,'triangle',.15); pop(tr('hole'),o.x,o.y-20,C.flame); break;
        case 'puddle': o.dead=true; P.v*=.85; { const d=P.lane===0?1:P.lane===2?-1:(Math.random()<.5?-1:1); P.lane+=d; } pop(tr('slip'),o.x,o.y-20,'#a9c3e6'); tone(260,.2,'sine',.1,0,180); break;
        case 'cone':
          if(P.turbo>0){ o.dead=true; G.score+=25; burst(o.x,o.y,C.flame,16); pop(tr('smash'),o.x,o.y,C.flame); tone(200,.1,'square',.1); }
          else if(P.inv<=0){ o.dead=true; hit(tr('crash')); S.crash(); }
          break;
        default: // ped, dog, scoot
          if(P.inv<=0){ hit(tr('crash')); S.crash(); }
          if(o.type==='ped'){ o.scared=true; o.vx=(o.x<P.x?-1:1)*260; }
          if(o.type==='scoot'){ o.vy=P.v+60; }
      }
    }
  }
  if(state!=='play') return;
  G.objs = G.objs.filter(o => o.y<H+140 && o.y>-400 && !(o.dead && o.type!=='hole') && !((o.type==='ped'||o.type==='dog') && (o.x<road.x-90||o.x>road.x+road.w+90)));
  for(const p of G.pops) p.t+=dt; G.pops=G.pops.filter(p=>p.t<1.1);
  for(const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt+dy; p.vx*=.94; p.vy*=.94; } G.parts=G.parts.filter(p=>p.t<p.life);
  if(m.timed && G.got>=m.goal) return end(true);
  hud();
}
function hit(msg){
  if(P.inv>0) return;
  G.lives--; P.inv=1.8; P.v*=.25; G.shake=.35;
  pop(msg,P.x,P.y-80,C.flame,20); burst(P.x,P.y-20,C.red,18); hud();
  if(G.lives<=0) setTimeout(()=>end(false,'rLives'),400);
}

/* ======================= DIBUIX ======================= */
function draw(){
  if(!W) return;
  const night = !!G.m?.night && state!=='menu';
  ctx.save();
  if(G.shake>0) ctx.translate(rand(-5,5)*G.shake*3, rand(-5,5)*G.shake*3);
  ctx.fillStyle=C.bg; ctx.fillRect(-20,-20,W+40,H+40);
  const sc=G.scroll, sw=Math.min(70, road.x);

  // illes de cases amb finestres
  const bOff=sc%170;
  for(let y=-170+bOff; y<H+170; y+=170){
    for(const side of [-1,1]){
      const x0 = side<0 ? 0 : road.x+road.w+sw+14, x1 = side<0 ? road.x-sw-14 : W;
      if(x1-x0 > 20){
        ctx.fillStyle=C.block; ctx.fillRect(x0,y-62,x1-x0,124);
        if(night){ for(let wy=y-50; wy<y+52; wy+=22) for(let wx=x0+12; wx<x1-12; wx+=24){ const lit=((wx*7+wy*13+Math.floor((sc-bOff)/170)*31)|0)%5===0; ctx.fillStyle=lit?'rgba(255,190,120,.85)':'rgba(239,232,228,.05)'; ctx.fillRect(wx,wy,10,12); } }
        else { ctx.fillStyle='rgba(239,232,228,.04)'; for(let wy=y-50; wy<y+52; wy+=22) for(let wx=x0+12; wx<x1-12; wx+=24) ctx.fillRect(wx,wy,10,12); }
      }
    }
  }
  // voreres
  ctx.fillStyle=C.side; ctx.fillRect(road.x-sw,0,sw,H); ctx.fillRect(road.x+road.w,0,sw,H);
  ctx.strokeStyle=C.sideLine; ctx.lineWidth=1;
  for(let y=-36+sc%36; y<H; y+=36){ ctx.beginPath(); ctx.moveTo(road.x-sw,y); ctx.lineTo(road.x,y); ctx.moveTo(road.x+road.w,y); ctx.lineTo(road.x+road.w+sw,y); ctx.stroke(); }
  for(let y=-170+bOff; y<H+170; y+=170){ tree(road.x-sw*.55, y); tree(road.x+road.w+sw*.55, y+85); }
  // fanals (nit)
  const lamps=[]; const lOff=sc%340;
  for(let y=-340+lOff; y<H+340; y+=340){ lamps.push([road.x-6,y]); lamps.push([road.x+road.w+6,y+170]); }
  // carril
  const lg=ctx.createLinearGradient(road.x,0,road.x+road.w,0); lg.addColorStop(0,'#6c0712'); lg.addColorStop(.5,C.lane); lg.addColorStop(1,'#6c0712');
  ctx.fillStyle=lg; ctx.fillRect(road.x,0,road.w,H);
  ctx.fillStyle=C.bone; ctx.fillRect(road.x-3,0,3,H); ctx.fillRect(road.x+road.w,0,3,H);
  ctx.fillStyle='rgba(239,232,228,.7)';
  for(let i=1;i<3;i++){ const x=road.x+road.lw*i-1.5; for(let y=-60+sc%60; y<H; y+=60) ctx.fillRect(x,y,3,30); }
  for(let y=-520+sc%520; y<H+80; y+=520) for(let i=0;i<3;i++) picto(laneX(i), y+(i%2)*260);

  // velocitat
  if(state==='play' && (P.v>400 || P.turbo>0)){
    ctx.strokeStyle=P.turbo>0?'rgba(255,59,31,.5)':'rgba(239,232,228,.18)'; ctx.lineWidth=2;
    for(let i=0;i<10;i++){ const x=road.x+Math.random()*road.w, y=Math.random()*H; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+rand(30,80)); ctx.stroke(); }
  }

  // objectes per capes
  const order={light:0,finish:0,hole:1,puddle:1,coin:2,parcel:2,turbo:2,heart:2,cone:3,scoot:4,dog:5,ped:5};
  const list=[...G.objs].sort((a,b)=>order[a.type]-order[b.type]);
  for(const o of list) DRAW[o.type]?.(o);

  // jugador
  if(state!=='menu'){
    const blink=P.inv>0 && P.turbo<=0 && Math.floor(G.t*14)%2===0;
    if(P.turbo>0){ const g=ctx.createRadialGradient(P.x,P.y-10,4,P.x,P.y-10,70); g.addColorStop(0,'rgba(255,59,31,.45)'); g.addColorStop(1,'rgba(255,59,31,0)'); ctx.fillStyle=g; ctx.fillRect(P.x-80,P.y-90,160,160); }
    if(!blink) drawRider(P.x,P.y,(laneX(P.lane)-P.x)*.006, pick.bike);
    const bt=G.t-G.bellT;
    if(bt<.6){ ctx.strokeStyle=`rgba(255,59,31,${1-bt/.6})`; ctx.lineWidth=3; for(let k=0;k<2;k++){ ctx.beginPath(); ctx.arc(P.x,P.y-30,16+bt*90+k*16,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); } }
  }
  for(const p of G.parts){ ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;

  // nit
  if(night) drawFog(lamps);
  else for(const [x,y] of lamps) lampPost(x,y,false);

  // textos flotants
  ctx.textAlign='center';
  for(const p of G.pops){ ctx.globalAlpha=1-p.t/1.1; ctx.font=`900 ${p.size}px "Schibsted Grotesk", Arial, sans-serif`; ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y-p.t*50); }
  ctx.globalAlpha=1;

  // compte enrere
  if(state==='count'){
    const n=Math.ceil(G.count-.2), f=(G.count-.2)%1;
    ctx.font=`900 ${110+ (1-f)*40}px "Schibsted Grotesk", Arial, sans-serif`; ctx.fillStyle=n<=0?C.red:C.bone; ctx.globalAlpha=Math.min(1,f*2+.2);
    ctx.fillText(n>0?n:tr('go'), W/2, H*.45); ctx.globalAlpha=1;
    ctx.font='700 14px "Schibsted Grotesk", Arial, sans-serif'; ctx.fillStyle=C.bone; ctx.fillText(tr('m_'+pick.mission).toUpperCase()+' · '+tr('g_'+pick.mission).toUpperCase(), W/2, H*.45+48);
  }
  // velocímetre
  if(state==='play'||state==='pause'||state==='count'){
    const kmh=Math.round(P.v/9);
    ctx.textAlign='right'; ctx.fillStyle=C.bone; ctx.font='900 36px "Schibsted Grotesk", Arial, sans-serif';
    ctx.fillText(kmh,W-18,H-30); ctx.font='700 11px "Schibsted Grotesk", Arial, sans-serif'; ctx.fillText('KM/H',W-18,H-14);
    if(P.turbo>0){ ctx.fillStyle=C.flame; ctx.fillRect(W-18-60,H-74,60*(P.turbo/3),4); }
  }
  ctx.restore();
}
function drawFog(lamps){
  fctx.globalCompositeOperation='source-over'; fctx.clearRect(0,0,W,H);
  fctx.fillStyle='rgba(6,4,8,.93)'; fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation='destination-out';
  const fy=P.y-(pick.bike==='cargo'?84:36);
  // feix del llum
  const g=fctx.createRadialGradient(P.x,fy,10,P.x,fy-40,360); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.55,'rgba(0,0,0,.7)'); g.addColorStop(1,'rgba(0,0,0,0)');
  fctx.fillStyle=g; fctx.beginPath(); fctx.moveTo(P.x-10,fy); fctx.lineTo(P.x-150,fy-380); fctx.lineTo(P.x+150,fy-380); fctx.lineTo(P.x+10,fy); fctx.closePath(); fctx.fill();
  const g2=fctx.createRadialGradient(P.x,P.y,10,P.x,P.y,90); g2.addColorStop(0,'rgba(0,0,0,.9)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  fctx.fillStyle=g2; fctx.beginPath(); fctx.arc(P.x,P.y,90,0,Math.PI*2); fctx.fill();
  for(const [x,y] of lamps){ const gl=fctx.createRadialGradient(x,y,4,x,y,120); gl.addColorStop(0,'rgba(0,0,0,.85)'); gl.addColorStop(1,'rgba(0,0,0,0)'); fctx.fillStyle=gl; fctx.beginPath(); fctx.arc(x,y,120,0,Math.PI*2); fctx.fill(); }
  for(const o of G.objs){ if(o.type==='light'){ const px=road.x+road.w+14, py=o.y-50; const gl=fctx.createRadialGradient(px,py,2,px,py,50); gl.addColorStop(0,'rgba(0,0,0,1)'); gl.addColorStop(1,'rgba(0,0,0,0)'); fctx.fillStyle=gl; fctx.beginPath(); fctx.arc(px,py,50,0,Math.PI*2); fctx.fill(); } }
  ctx.drawImage(fog,0,0,W,H);
  // tint càlid del llum
  { const tg=ctx.createRadialGradient(P.x,fy,5,P.x,fy-60,340); tg.addColorStop(0,'rgba(255,215,160,.16)'); tg.addColorStop(1,'rgba(255,215,160,0)'); ctx.fillStyle=tg; } ctx.beginPath(); ctx.moveTo(P.x-10,fy); ctx.lineTo(P.x-150,fy-380); ctx.lineTo(P.x+150,fy-380); ctx.lineTo(P.x+10,fy); ctx.fill();
  for(const [x,y] of lamps) lampPost(x,y,true);
  // semàfors visibles de nit
  for(const o of G.objs) if(o.type==='light') lightHead(o);
}
function lampPost(x,y,on){
  ctx.fillStyle='#0c0b0b'; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=on?'#ffd9a0':'#4a3f40'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  if(on){ ctx.fillStyle='rgba(255,200,130,.12)'; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill(); }
}
function tree(x,y){
  ctx.fillStyle=C.tree2; ctx.beginPath(); ctx.arc(x+3,y+3,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.tree; ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(227,18,43,.18)'; ctx.beginPath(); ctx.arc(x-6,y-6,8,0,Math.PI*2); ctx.fill();
}
function picto(x,y){
  ctx.save(); ctx.strokeStyle='rgba(239,232,228,.25)'; ctx.translate(x,y); ctx.rotate(-Math.PI/2); ctx.scale(.3,.3); ctx.translate(-100,-70);
  ctx.beginPath(); ctx.arc(45,82,30,0,Math.PI*2); ctx.moveTo(185,82); ctx.arc(155,82,30,0,Math.PI*2);
  ctx.moveTo(45,82); ctx.lineTo(96,82); ctx.lineTo(80,38); ctx.lineTo(45,82); ctx.moveTo(80,38); ctx.lineTo(140,36); ctx.lineTo(96,82); ctx.moveTo(140,36); ctx.lineTo(155,82);
  ctx.lineWidth=8; ctx.stroke(); ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shadow(x,y,rx,ry){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x+3,y+4,rx,ry,0,0,Math.PI*2); ctx.fill(); }
function lightHead(o){
  const st=lightState(o), px=road.x+road.w+14, py=o.y-8;
  ctx.fillStyle=C.black; rr(px-13,py-78,26,74,7); ctx.fill(); ctx.strokeStyle='#3a3132'; ctx.lineWidth=1.5; ctx.stroke();
  for(const [s,c,y] of [['red','#ff2a2a',py-64],['yellow','#ffb21f',py-41],['green','#3ee07a',py-18]]){
    ctx.beginPath(); ctx.arc(px,y,8,0,Math.PI*2);
    if(s===st){ ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=18; } else { ctx.fillStyle='#2a2223'; ctx.shadowBlur=0; }
    ctx.fill(); ctx.shadowBlur=0;
  }
  // icona de bici al semàfor
  ctx.strokeStyle='rgba(239,232,228,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px-4,py-1,2.5,0,Math.PI*2); ctx.arc(px+4,py-1,2.5,0,Math.PI*2); ctx.stroke();
}
const DRAW = {
  light(o){
    const st=lightState(o);
    if(st==='red'){ const g=ctx.createLinearGradient(0,o.y-140,0,o.y); g.addColorStop(0,'rgba(255,42,42,0)'); g.addColorStop(1,'rgba(255,42,42,.16)'); ctx.fillStyle=g; ctx.fillRect(road.x,o.y-140,road.w,140); }
    ctx.fillStyle=C.bone; ctx.fillRect(road.x,o.y,road.w,7);
    ctx.fillStyle='rgba(239,232,228,.85)'; for(let x=road.x; x<road.x+road.w; x+=22) ctx.fillRect(x,o.y+14,12,6);
    ctx.fillStyle='#000'; ctx.fillRect(road.x+road.w+12,o.y-8,4,12);
    lightHead(o);
  },
  finish(o){
    const s=14;
    for(let r=0;r<2;r++) for(let x=road.x, i=0; x<road.x+road.w; x+=s, i++){ ctx.fillStyle=(i+r)%2?C.bone:C.black; ctx.fillRect(x,o.y+r*s,Math.min(s,road.x+road.w-x),s); }
    ctx.fillStyle=C.red; rr(road.x+road.w/2-60,o.y-44,120,30,15); ctx.fill();
    ctx.fillStyle=C.bone; ctx.font='900 16px "Schibsted Grotesk", Arial'; ctx.textAlign='center'; ctx.fillText(lang==='en'?'FINISH':'META', road.x+road.w/2, o.y-23);
  },
  cone(o){
    shadow(o.x,o.y,15,15);
    ctx.fillStyle=C.black; rr(o.x-14,o.y-14,28,28,4); ctx.fill();
    ctx.fillStyle=C.flame; ctx.beginPath(); ctx.arc(o.x,o.y,11,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.bone; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(o.x,o.y,6.5,0,Math.PI*2); ctx.stroke();
  },
  hole(o){
    ctx.globalAlpha=o.dead?.5:1;
    ctx.fillStyle='#3a080f'; ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r+5,o.r-1,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.black; ctx.beginPath(); ctx.ellipse(o.x+1,o.y+1,o.r,o.r-5,.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#4f0c15'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(o.x-o.r-6,o.y-2); ctx.lineTo(o.x-o.r-14,o.y-8); ctx.moveTo(o.x+o.r+4,o.y+3); ctx.lineTo(o.x+o.r+12,o.y+9); ctx.stroke();
    ctx.globalAlpha=1;
  },
  puddle(o){
    ctx.fillStyle='rgba(140,165,200,.35)'; ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r+8,o.r-2,.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(220,235,255,.45)'; ctx.lineWidth=1.5; const r=(G.t*20)%14;
    ctx.beginPath(); ctx.ellipse(o.x-4,o.y,4+r,2+r*.5,0,0,Math.PI*2); ctx.stroke();
  },
  coin(o){
    const s=Math.abs(Math.cos(G.t*4+o.y*.02));
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(.3+s*.7,1);
    ctx.shadowColor=C.bone; ctx.shadowBlur=G.m?.night?14:0;
    ctx.fillStyle=C.bone; ctx.beginPath(); ctx.arc(0,0,o.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=C.red; ctx.lineWidth=2;
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*3.5,Math.sin(a)*3.5); ctx.lineTo(Math.cos(a)*8,Math.sin(a)*8); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.stroke(); ctx.restore();
  },
  parcel(o){
    const b=Math.sin(G.t*4+o.ph)*2;
    shadow(o.x,o.y,14,12);
    ctx.save(); ctx.translate(o.x,o.y+b); ctx.rotate(.12);
    ctx.fillStyle='#d8c6b8'; rr(-13,-13,26,26,3); ctx.fill();
    ctx.fillStyle=C.red; ctx.fillRect(-3,-13,6,26); ctx.fillRect(-13,-3,26,6);
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; rr(-13,-13,26,26,3); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle=`rgba(239,232,228,${.3+.3*Math.sin(G.t*6)})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(o.x,o.y+b,22,0,Math.PI*2); ctx.stroke();
  },
  turbo(o){
    const p=1+Math.sin(G.t*8)*.1;
    const g=ctx.createRadialGradient(o.x,o.y,2,o.x,o.y,30); g.addColorStop(0,'rgba(255,59,31,.7)'); g.addColorStop(1,'rgba(255,59,31,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,30,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(p,p);
    ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.bone; ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(-5,1); ctx.lineTo(0,1); ctx.lineTo(-2,9); ctx.lineTo(6,-2); ctx.lineTo(1,-2); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  heart(o){
    const p=1+Math.sin(G.t*6)*.12;
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(p,p); ctx.fillStyle=C.red; ctx.shadowColor=C.red; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(0,10); ctx.bezierCurveTo(-16,-2,-8,-14,0,-6); ctx.bezierCurveTo(8,-14,16,-2,0,10); ctx.fill(); ctx.restore();
  },
  scoot(o){
    shadow(o.x,o.y,10,26);
    ctx.save(); ctx.translate(o.x,o.y);
    ctx.fillStyle='#2a2223'; rr(-5,-26,10,50,5); ctx.fill();
    ctx.fillStyle=C.black; rr(-3,-30,6,10,3); ctx.fill(); rr(-3,20,6,10,3); ctx.fill();
    ctx.strokeStyle='#8a7d7e'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-11,-22); ctx.lineTo(11,-22); ctx.stroke();
    ctx.fillStyle=o.c; ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=o.c; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-8,-2); ctx.lineTo(-10,-20); ctx.moveTo(8,-2); ctx.lineTo(10,-20); ctx.stroke();
    ctx.fillStyle='#3b2b2a'; ctx.beginPath(); ctx.arc(0,-4,5.5,0,Math.PI*2); ctx.fill();
    if(o.moved){ ctx.fillStyle=C.flame; ctx.font='900 14px "Schibsted Grotesk", Arial'; ctx.textAlign='center'; ctx.fillText('!',0,-34); }
    ctx.restore();
  },
  ped(o){
    const dir=Math.sign(o.vx)||1, sw=Math.sin(o.ph)*5;
    ctx.save(); ctx.translate(o.x,o.y); shadow(0,0,13,9);
    ctx.fillStyle='#2a1f1f'; ctx.fillRect(dir*sw-3,-8,6,6); ctx.fillRect(-dir*sw-3,2,6,6);
    ctx.fillStyle=o.c; ctx.beginPath(); ctx.ellipse(0,0,7,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3b2b2a'; ctx.beginPath(); ctx.arc(dir*2,0,5.5,0,Math.PI*2); ctx.fill();
    if(o.scared){ ctx.fillStyle=C.flame; ctx.font='900 16px "Schibsted Grotesk", Arial'; ctx.textAlign='center'; ctx.fillText('!',0,-16); }
    ctx.restore();
  },
  dog(o){
    const dir=Math.sign(o.vx)||1, wag=Math.sin(o.ph)*.6;
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(dir,1); shadow(0,0,14,7);
    ctx.fillStyle='#b9a48f'; ctx.beginPath(); ctx.ellipse(0,0,13,6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(14,0,5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#6d5a4a'; ctx.beginPath(); ctx.ellipse(13,-5,3,2,0,0,Math.PI*2); ctx.ellipse(13,5,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#b9a48f'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(-20,Math.sin(wag)*7); ctx.stroke();
    ctx.restore();
  }
};
function drawRider(x,y,tilt,kind){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  ctx.lineCap='round';
  if(kind==='cargo'){
    shadow(0,-20,20,62);
    ctx.fillStyle=C.black; rr(-4,16,8,24,4); ctx.fill();              // roda darrera
    ctx.strokeStyle=C.bone; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(0,28); ctx.stroke();
    // caixa
    ctx.fillStyle='#5a0a13'; rr(-17,-86,34,46,5); ctx.fill();
    ctx.fillStyle=C.red; rr(-15,-84,30,42,4); ctx.fill();
    ctx.strokeStyle=C.bone; ctx.lineWidth=2; rr(-15,-84,30,42,4); ctx.stroke();
    ctx.fillStyle='rgba(239,232,228,.85)'; ctx.font='900 9px "Schibsted Grotesk", Arial'; ctx.textAlign='center'; ctx.save(); ctx.translate(0,-63); ctx.rotate(-Math.PI/2); ctx.fillText('EF.BIKE',0,3); ctx.restore();
    // càrrega visible
    if(G && pick.mission==='deliver' && G.got>0){ for(let i=0;i<Math.min(4,Math.ceil(G.got/2));i++){ ctx.fillStyle='#d8c6b8'; ctx.fillRect(-11+(i%2)*12,-80+Math.floor(i/2)*16,10,12); } }
    ctx.strokeStyle=C.bone; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(-14,-30); ctx.lineTo(14,-30); ctx.stroke();
    ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-9,-4); ctx.lineTo(-13,-28); ctx.moveTo(9,-4); ctx.lineTo(13,-28); ctx.stroke();
    if(G?.m?.night){ ctx.fillStyle='#fff2c8'; ctx.beginPath(); ctx.arc(0,-87,3,0,Math.PI*2); ctx.fill(); }
  } else if(kind==='fold'){
    shadow(0,2,12,28);
    ctx.fillStyle=C.black; rr(-3,-30,6,14,3); ctx.fill(); rr(-3,14,6,14,3); ctx.fill();
    ctx.strokeStyle=C.bone; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,20); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-4,3,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-10,-20); ctx.lineTo(10,-20); ctx.stroke();
    ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-9,-2); ctx.lineTo(-10,-18); ctx.moveTo(9,-2); ctx.lineTo(10,-18); ctx.stroke();
    if(G?.m?.night){ ctx.fillStyle='#fff2c8'; ctx.beginPath(); ctx.arc(0,-31,2.5,0,Math.PI*2); ctx.fill(); }
  } else {
    shadow(0,2,14,38);
    ctx.fillStyle=C.black; rr(-3.5,-40,7,22,3.5); ctx.fill(); rr(-3.5,16,7,22,3.5); ctx.fill();
    ctx.strokeStyle=C.bone; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,24); ctx.stroke();
    // cistella
    ctx.strokeStyle=C.bone; ctx.lineWidth=1.5; rr(-9,-46,18,14,3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3,-46); ctx.lineTo(-3,-32); ctx.moveTo(3,-46); ctx.lineTo(3,-32); ctx.stroke();
    // portabagatge
    ctx.fillStyle='rgba(239,232,228,.5)'; ctx.fillRect(-7,14,14,3); ctx.fillRect(-7,20,14,3);
    ctx.strokeStyle=C.bone; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(-14,-24); ctx.lineTo(14,-24); ctx.stroke();
    ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-9,-2); ctx.lineTo(-13,-22); ctx.moveTo(9,-2); ctx.lineTo(13,-22); ctx.stroke();
    if(G?.m?.night){ ctx.fillStyle='#fff2c8'; ctx.beginPath(); ctx.arc(0,-48,2.5,0,Math.PI*2); ctx.fill(); }
  }
  // ciclista
  ctx.fillStyle=C.red; ctx.beginPath(); ctx.ellipse(0,2,12,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.black; ctx.fillRect(-2,-4,4,14);
  ctx.fillStyle=C.bone; ctx.beginPath(); ctx.ellipse(0,-7,6.5,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.red; ctx.fillRect(-1.5,-14,3,14);
  // llum vermell darrera
  if(G?.m?.night){ ctx.fillStyle=Math.floor(G.t*4)%2?'#ff2a2a':'#7a0814'; ctx.beginPath(); ctx.arc(0,kind==='cargo'?40:kind==='fold'?28:38,2.5,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

/* ======================= IDIOMA ======================= */
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent=t[el.dataset.i18n]);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===lang));
  $('closeGame').setAttribute('aria-label', t.close);
  gm.setAttribute('aria-label', t.m_deliver ? (lang==='en'?'Bike Lane':'Carril Bici') : '');
  const g=`<div class="group">
    <span class="mark">eduardfolch.bike<sup>®</sup></span><span class="meta"><b>${t.tag1}</b>${t.tag2}</span><span class="meta num"><b>41.3874° N, 2.1686° E</b>Barcelona</span>
    <span class="mark">eduardfolch.bike<sup>®</sup></span><span class="meta"><b>${t.tag1}</b>${t.tag2}</span><span class="meta num"><b>41.3874° N, 2.1686° E</b>Barcelona</span></div>`;
  $('track').innerHTML=g+g;
  if(!gm.hidden){ renderCards(); hud(true); }
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang=b.dataset.lang; try{ localStorage.setItem('efb-lang',lang); }catch(e){} render();
}));
render();

/* ======================= COPIAR ======================= */
const btn=$('copy');
btn.addEventListener('click', () => {
  const addr=$('addr'), reset=()=>setTimeout(()=>btn.textContent=tr('copy'),1800);
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(addr); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent=tr('sel'); reset(); };
  try{ navigator.clipboard.writeText(addr.textContent).then(()=>{ btn.textContent=tr('copied'); reset(); }, fallback); }catch(e){ fallback(); }
});
})();
